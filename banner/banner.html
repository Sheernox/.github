<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<title>Sheernox profile banner</title>
<!-- Source for profile/assets/banner.png. Edit here, then run python3 scripts/render-banner.py.
     Drawn at 1280x400 CSS px and captured at 2x; the rounded corners stay transparent. -->
<style>
  @font-face { font-family: 'Outfit'; font-weight: 500; src: url(fonts/outfit-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Outfit'; font-weight: 600; src: url(fonts/outfit-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Outfit'; font-weight: 800; src: url(fonts/outfit-latin-800-normal.woff2) format('woff2'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  .banner { position: relative; width: 1280px; height: 400px; overflow: hidden; border-radius: 16px; font-family: 'Outfit', sans-serif; color: #fff;
    background: #090217; background-image: radial-gradient(ellipse at 12% -10%, #9333ea80 0%, transparent 55%), radial-gradient(ellipse at 60% 120%, #0369a166 0%, transparent 55%); }
  .stripes { position: absolute; right: -77px; top: -10%; height: 120%; display: flex; gap: 15px; transform: skewX(-16deg); }
  .stripes i { width: 59px; border-radius: 8px; }
  .copy { position: absolute; left: 77px; top: 50%; transform: translateY(-50%); width: 720px; }
  .logo { display: block; width: 243px; height: auto; }
  h1 { margin-top: 31px; font-size: 63px; line-height: 1.04; font-weight: 800; letter-spacing: -.02em; }
  h1 span { background: linear-gradient(90deg, #a855f7, #60a5fa); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 18px; font-size: 22px; font-weight: 500; color: #d8cff0; }
  .chips { display: flex; gap: 10px; margin-top: 26px; }
  .chips span { font-size: 14px; font-weight: 600; padding: 6px 14px; border-radius: 99px; background: #ffffff14; border: 1px solid #ffffff2e; color: #ece6fb; }
</style>
</head>
<body>
<div class="banner" id="banner">
  <div class="stripes" aria-hidden="true">
    <i style="background: linear-gradient(180deg, #8b5cf6, #60a5fa)"></i>
    <i style="background: linear-gradient(180deg, #ef4444, #f59e0b)"></i>
    <i style="background: linear-gradient(180deg, #3b82f6, #38bdf8)"></i>
    <i style="background: linear-gradient(180deg, #10b981, #14b8a6)"></i>
    <i style="background: linear-gradient(180deg, #d946ef, #e11d48)"></i>
    <i style="background: linear-gradient(180deg, #2dd4bf, #38bdf8)"></i>
    <i style="background: linear-gradient(180deg, #6366f1, #a855f7)"></i>
  </div>
  <div class="copy">
    <img class="logo" src="sheernox-logo-white.svg" alt="Sheernox Technology Group">
    <h1>Hosting, Cloud &amp;<br><span>Custom Builds</span></h1>
    <p class="sub">Canadian IT, powering businesses online since 2009.</p>
    <div class="chips"><span>Kamloops, BC</span><span>99.9% uptime SLA</span><span>24/7 support</span></div>
  </div>
</div>
</body>
</html>
